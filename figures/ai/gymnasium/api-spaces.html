<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; font-family: "Segoe UI", sans-serif; }
  .frame { display: inline-block; margin: 2px; padding: 14px; border: 1.5px dashed #333; border-radius: 10px; }
  .title { display: inline-block; border: 2px solid #e8a317; padding: 2px 6px; font-size: 22px; font-weight: 600; color: #222; margin-bottom: 18px; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; width: 1220px; align-items: stretch; }
  .row .group { flex: 1 1 auto; }
  .group { border: 1.5px dashed #0f6cbd; border-radius: 6px; padding: 12px; box-sizing: border-box; }
  .group .title { white-space: nowrap; color: #0f6cbd; font-size: 19px; margin-bottom: 12px; }
  .item { border: 2px solid #e8a317; background: #f3f7fd; border-radius: 3px; height: 34px; margin-bottom: 8px; white-space: nowrap; padding: 0 12px;
          display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #222; }
</style><style>.item { border: 1.5px solid #0f6cbd; }</style>
</head>
<style>.item { border: 1.5px solid #0f6cbd; background: #f3f7fd; font-weight: 600; }</style>
<style>.item { border: 1.5px solid #0f6cbd; background: #f3f7fd; font-weight: 600; }</style>
<body>
<div class="frame" id="fig">
  <div class="title">2.3 Spaces</div>
  <div class="row">
    <div class="group">
      <div class="title">Methods</div>
      <div class="item">Space.sample</div>
      <div class="item">Space.contains</div>
      <div class="item">Space.seed</div>
      <div class="item">Space.to_jsonable</div>
      <div class="item">Space.from_jsonable</div>
    </div>
    <div class="group">
      <div class="title">Fundamental Spaces</div>
      <div class="item">Box</div>
      <div class="item">Discrete</div>
      <div class="item">MultiBinary</div>
      <div class="item">MultiDiscrete</div>
      <div class="item">Text</div>
    </div>
    <div class="group">
      <div class="title">Composite Spaces</div>
      <div class="item">Dict</div>
      <div class="item">Tuple</div>
      <div class="item">Sequence</div>
      <div class="item">Graph</div>
      <div class="item">OneOf</div>
    </div>
    <div class="group">
      <div class="title">Spaces Utils</div>
    </div>
  </div>
</div>
</body></html>
