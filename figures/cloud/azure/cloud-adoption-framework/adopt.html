<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; font-family: "Segoe UI", sans-serif; }
  .frame { display: inline-block; margin: 2px; padding: 14px 14px 14px; border: 1.5px dashed #333; border-radius: 10px; }
  .title { display: inline-block; border: 2px solid #e8a317; padding: 2px 6px; font-size: 22px; font-weight: 600; color: #222; margin-bottom: 18px; }
  .row { display: flex; gap: 14px; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .col .group { flex: 1 0 auto; }
  .group { width: 420px; border: 1.5px dashed #0f6cbd; border-radius: 6px; padding: 12px; box-sizing: border-box; }
  .group .title { white-space: nowrap; color: #0f6cbd; font-size: 19px; margin-bottom: 12px; }
  .item { border: 2px solid #e8a317; background: #f3f7fd; border-radius: 3px; height: 34px; margin-bottom: 8px;
          display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; text-align: center; padding: 0 6px; color: #222; }
</style></head>
<body>
<div class="frame" id="fig" style="position:relative;">
  <div class="title">Adopt</div>
  <div class="row" style="gap:70px;align-items:flex-start;">
    <div class="col">
      <div class="group" style="border:none;padding:0 12px 0 12px;">
        <div class="item" id="f0">Migration</div>
        <div class="item" id="f1">Modernization</div>
        <div class="item" id="f2">Cloud-native</div>
      </div>
    </div>
    <div class="col" style="gap:16px;">
      <div class="group">
        <div class="title" id="t0">Migration</div>
        <div class="item">Plan</div>
        <div class="item">Prepare</div>
        <div class="item">Execute</div>
        <div class="item">Optimize</div>
        <div class="item">Decommission</div>
      </div>
      <div class="group">
        <div class="title" id="t1">Modernization</div>
        <div class="item">Prepare</div>
        <div class="item">Plan</div>
        <div class="item">Execute</div>
        <div class="item">Optimize</div>
      </div>
      <div class="group">
        <div class="title" id="t2">Cloud-native</div>
        <div class="item">Plan</div>
        <div class="item">Build</div>
        <div class="item">Deploy</div>
        <div class="item">Optimize</div>
      </div>
    </div>
  </div>
  <svg id="link" style="position:absolute;left:0;top:0;overflow:visible;pointer-events:none;"></svg>
</div>
<script>
  const fig = document.getElementById('fig').getBoundingClientRect();
  let p = '';
  for (const [f, t] of [['f0','t0'],['f1','t1'],['f2','t2']]) {
    const a = document.getElementById(f).getBoundingClientRect(), b = document.getElementById(t).getBoundingClientRect();
    const x1 = a.right - fig.left, y1 = a.top + a.height / 2 - fig.top, x2 = b.left - fig.left, y2 = b.top + b.height / 2 - fig.top, mx = (x1 + x2) / 2;
    p += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="#0f6cbd" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  }
  document.getElementById('link').innerHTML = p;
</script>
</body></html>
