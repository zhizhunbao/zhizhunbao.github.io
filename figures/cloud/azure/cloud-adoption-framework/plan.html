<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; font-family: "Segoe UI", sans-serif; }
  .frame { display: inline-block; margin: 2px; padding: 14px 14px 14px; border: 1.5px dashed #333; border-radius: 10px; }
  .title { display: inline-block; border: 2px solid #e8a317; padding: 2px 6px; font-size: 22px; font-weight: 600; color: #222; margin-bottom: 18px; }
  .row { display: flex; gap: 14px; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .col .group { flex: 1 0 auto; }
  .group { width: 330px; border: 1.5px dashed #0f6cbd; border-radius: 6px; padding: 12px; box-sizing: border-box; }
  .group .title { white-space: nowrap; color: #0f6cbd; font-size: 19px; margin-bottom: 12px; }
  .item { border: 2px solid #e8a317; background: #f3f7fd; border-radius: 3px; height: 34px; margin-bottom: 8px;
          display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; text-align: center; padding: 0 6px; color: #222; }
  .group { width: max-content; }
</style></head>
<body>
<div class="frame" id="fig">
  <div class="title">Plan</div>
  <div class="row">
    <div class="col">
      <div class="group">
        <div class="title">Define operating model</div>
      </div>
    </div>
    <div class="col">
      <div class="group">
        <div class="title">Gain cloud skills</div>
      </div>
    </div>
    <div class="col">
      <div class="group">
        <div class="title">Plan migration</div>
        <div class="item">Migration waves</div>
        <div class="item">Nonproduction environment</div>
        <div class="item">Downtime migration</div>
        <div class="item">Near-zero downtime migration</div>
        <div class="item">Rollback plan</div>
        <div class="item">Performance benchmark</div>
      </div>
    </div>
    <div class="col">
      <div class="group">
        <div class="title">Estimate cloud costs</div>
      </div>
    </div>
    <div class="col">
      <div class="group">
        <div class="title">Document adoption plan</div>
      </div>
    </div>
  </div>
</div>
</body></html>
