<!doctype html>
<html><head><meta charset="utf-8">
<!-- Point: Azure adoption goes through seven phases, numbered 1 to 7 in the CAF overview's "Azure adoption phases" table; each box is the key word of that phase's Glossary quote. -->
<style>
  body { margin: 0; background: #fff; font-family: "Segoe UI", sans-serif; }
  .frame { display: inline-block; margin: 2px; padding: 14px; border: 1.5px dashed #333; border-radius: 10px; position: relative; }
  .title { display: inline-block; border: 2px solid #e8a317; padding: 2px 6px; font-size: 22px; font-weight: 600; color: #222; margin-bottom: 18px; }
  .row { display: flex; align-items: stretch; }
  .wrap { height: 50px; }
  .group { width: 330px; border: 1.5px dashed #0f6cbd; border-radius: 6px; padding: 12px; box-sizing: border-box; }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .step { width: 28px; height: 28px; border-radius: 50%; background: #107c10; color: #fff; font-size: 16px; font-weight: 700;
          display: flex; align-items: center; justify-content: center; flex: none; }
  .group .title { white-space: nowrap; color: #0f6cbd; font-size: 19px; margin-bottom: 0; }
  .item { border: 1.5px solid #0f6cbd; background: #f3f7fd; border-radius: 3px; height: 46px; white-space: nowrap;
          display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-align: center; padding: 0 6px; color: #222; }
  .arrow { width: 60px; display: flex; justify-content: center; align-items: center; flex: none; }
  #link { position: absolute; left: 0; top: 0; pointer-events: none; }
</style></head>
<body>
<div class="frame" id="fig">
  <div class="title">Azure adoption phases</div>
  <div class="row">
    <div class="group">
      <div class="head"><div class="step">1</div><div class="title">Strategy</div></div>
      <div class="item">Cloud adoption strategy</div>
    </div>
    <div class="arrow"><svg width="48" height="20"><line x1="2" y1="10" x2="36" y2="10" stroke="#107c10" stroke-width="2.5"/><polygon points="36,3 46,10 36,17" fill="#107c10"/></svg></div>
    <div class="group">
      <div class="head"><div class="step">2</div><div class="title">Plan</div></div>
      <div class="item">Cloud adoption plan</div>
    </div>
    <div class="arrow"><svg width="48" height="20"><line x1="2" y1="10" x2="36" y2="10" stroke="#107c10" stroke-width="2.5"/><polygon points="36,3 46,10 36,17" fill="#107c10"/></svg></div>
    <div class="group">
      <div class="head"><div class="step">3</div><div class="title">Ready</div></div>
      <div class="item">Azure landing zone</div>
    </div>
    <div class="arrow"><svg width="48" height="20"><line x1="2" y1="10" x2="36" y2="10" stroke="#107c10" stroke-width="2.5"/><polygon points="36,3 46,10 36,17" fill="#107c10"/></svg></div>
    <div class="group" id="g4">
      <div class="head"><div class="step">4</div><div class="title">Adopt</div></div>
      <div class="item">Migrate, modernize, and build workloads</div>
    </div>
  </div>
  <div class="wrap"></div>
  <div class="row">
    <div class="group" id="g5">
      <div class="head"><div class="step">5</div><div class="title">Govern</div></div>
      <div class="item">Guardrails</div>
    </div>
    <div class="arrow"><svg width="48" height="20"><line x1="2" y1="10" x2="36" y2="10" stroke="#107c10" stroke-width="2.5"/><polygon points="36,3 46,10 36,17" fill="#107c10"/></svg></div>
    <div class="group">
      <div class="head"><div class="step">6</div><div class="title">Secure</div></div>
      <div class="item">Azure cloud estate</div>
    </div>
    <div class="arrow"><svg width="48" height="20"><line x1="2" y1="10" x2="36" y2="10" stroke="#107c10" stroke-width="2.5"/><polygon points="36,3 46,10 36,17" fill="#107c10"/></svg></div>
    <div class="group">
      <div class="head"><div class="step">7</div><div class="title">Manage</div></div>
      <div class="item">RAMP (Ready, Administer, Monitor, Protect)</div>
    </div>
  </div>
  <svg id="link"></svg>
</div>
<script>
  // Elbow arrow from Adopt (4) down to Govern (5) across the row break.
  const fig = document.getElementById('fig'), svg = document.getElementById('link');
  const f = fig.getBoundingClientRect(), a = document.getElementById('g4').getBoundingClientRect(), g = document.getElementById('g5').getBoundingClientRect();
  svg.setAttribute('width', f.width); svg.setAttribute('height', f.height);
  const x1 = a.left + a.width / 2 - f.left, y1 = a.bottom - f.top, ym = y1 + 25, x2 = g.left + g.width / 2 - f.left, y2 = g.top - f.top;
  svg.innerHTML = `<polyline points="${x1},${y1} ${x1},${ym} ${x2},${ym} ${x2},${y2 - 9}" fill="none" stroke="#107c10" stroke-width="2.5"/>` +
                  `<polygon points="${x2 - 7},${y2 - 10} ${x2},${y2} ${x2 + 7},${y2 - 10}" fill="#107c10"/>`;
</script>
</body></html>
