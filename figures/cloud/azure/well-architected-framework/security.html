<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; font-family: "Segoe UI", sans-serif; }
  .frame { display: inline-block; margin: 2px; padding: 14px 14px 14px; border: 1.5px dashed #333; border-radius: 10px; }
  .title { display: inline-block; border: 2px solid #e8a317; padding: 2px 6px; font-size: 22px; font-weight: 600; color: #222; margin-bottom: 18px; }
  .row { display: flex; gap: 14px; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .col .group { flex: 1 0 auto; }
  .group { border: 1.5px dashed #0f6cbd; border-radius: 6px; padding: 12px; box-sizing: border-box; }
  .item { border: 2px solid #e8a317; background: #f3f7fd; border-radius: 3px; height: 34px; margin-bottom: 8px; white-space: nowrap;
          display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; text-align: center; padding: 0 24px; color: #222; }
</style></head>
<body>
<div class="frame" id="fig">
  <div class="title">Security</div>
  <div class="col" style="gap:0;">
    <div class="item">Plan your security readiness</div>
    <div class="item">Design to protect confidentiality</div>
    <div class="item">Design to protect integrity</div>
    <div class="item">Design to protect availability</div>
    <div class="item">Sustain and evolve your security posture</div>
  </div>
</div>
</body></html>
