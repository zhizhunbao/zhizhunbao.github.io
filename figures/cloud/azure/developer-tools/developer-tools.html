<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; font-family: "Segoe UI", sans-serif; }
  .frame { display: inline-block; margin: 2px; padding: 14px; border: 1.5px dashed #333; border-radius: 10px; }
  .title { display: inline-block; border: 2px solid #e8a317; padding: 2px 6px; font-size: 22px; font-weight: 600; color: #222; margin-bottom: 18px; }
  .row { display: flex; gap: 20px; align-items: stretch; }
  .row + .row { margin-top: 20px; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .col .group { flex: 1 0 auto; }
  .group { min-width: 390px; border: 1.5px dashed #0f6cbd; border-radius: 6px; padding: 12px; box-sizing: border-box; }
  .group .title { white-space: nowrap; color: #0f6cbd; font-size: 19px; margin-bottom: 12px; }
  .item { border: 2px solid #e8a317; background: #f3f7fd; border-radius: 3px; height: 50px; margin-bottom: 10px;
          display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-align: center; padding: 0 6px; color: #222; }
  .grid { display: grid; grid-template-columns: repeat(4, 330px); gap: 0 14px; }
</style></head>
<body>
<div class="frame" id="fig">
  <div class="title">Developer Tools</div>
  <div class="grid">
    <div class="item">App Configuration</div>
    <div class="item">Azure Boards</div>
    <div class="item">Azure DevOps</div>
    <div class="item">Azure DevTest Labs</div>
    <div class="item">Azure Pipelines</div>
    <div class="item">Microsoft Dev Box</div>
    <div class="item">Microsoft Playwright Testing (Preview)</div>
    <div class="item">Visual Studio</div>
    <div class="item">Visual Studio Code</div>
  </div>
</div>
</body></html>
