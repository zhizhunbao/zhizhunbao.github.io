<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; font-family: "Segoe UI", sans-serif; }
  .frame { display: inline-block; margin: 2px; padding: 14px 14px 14px; border: 1.5px dashed #333; border-radius: 10px; }
  .title { display: inline-block; border: 2px solid #e8a317; padding: 2px 6px; font-size: 22px; font-weight: 600; color: #222; margin-bottom: 18px; }
  .row { display: flex; gap: 14px; align-items: stretch; margin-bottom: 14px; }
  .row:last-child { margin-bottom: 0; }
  .group { width: 300px; border: 1.5px dashed #0f6cbd; border-radius: 6px; padding: 12px; box-sizing: border-box; }
  .group .title { white-space: nowrap; color: #0f6cbd; font-size: 19px; margin-bottom: 12px; }
  .group .title:last-child { margin-bottom: 0; }
  .item { border: 2px solid #e8a317; background: #f3f7fd; border-radius: 3px; height: 34px; margin-bottom: 8px;
          display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; text-align: center; padding: 0 6px; color: #222; }
  .item:last-child { margin-bottom: 0; }
</style></head>
<body>
<div class="frame" id="fig">
  <div class="title">Benefits</div>
  <div class="row">
    <div class="group">
      <div class="title">High availability</div>
    </div>
    <div class="group">
      <div class="title">Scalability</div>
      <div class="item">Vertical scaling</div>
      <div class="item">Horizontal scaling</div>
    </div>
    <div class="group">
      <div class="title">Reliability</div>
    </div>
    <div class="group">
      <div class="title">Predictability</div>
      <div class="item">Performance predictability</div>
      <div class="item">Cost predictability</div>
    </div>
  </div>
  <div class="row">
    <div class="group">
      <div class="title">Security</div>
    </div>
    <div class="group">
      <div class="title">Governance</div>
    </div>
    <div class="group">
      <div class="title">Manageability</div>
      <div class="item">Management of the cloud</div>
      <div class="item">Management in the cloud</div>
    </div>
  </div>
</div>
</body></html>
