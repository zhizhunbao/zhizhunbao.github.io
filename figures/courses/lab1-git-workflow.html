<!doctype html>
<html><head><meta charset="utf-8">
<!-- Point: the Lab 1 work goes from a private repository through a branch and a pull request into main. -->
<style>
  body { margin: 0; background: #fff; font-family: "Segoe UI", sans-serif; }
  .frame { display: inline-block; margin: 2px; padding: 14px; border: 1.5px dashed #333; border-radius: 10px; }
  .title { display: inline-block; border: 2px solid #e8a317; padding: 2px 6px; font-size: 22px; font-weight: 600; color: #222; margin-bottom: 18px; }
  .row { display: flex; align-items: stretch; }
  .group { border: 1.5px dashed #0f6cbd; border-radius: 6px; padding: 12px; box-sizing: border-box; }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .step { width: 28px; height: 28px; border-radius: 50%; background: #107c10; color: #fff; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
  .group .title { white-space: nowrap; color: #0f6cbd; font-size: 19px; margin-bottom: 0; }
  .item { border: 1.5px solid #0f6cbd; background: #f3f7fd; border-radius: 3px; height: 44px; margin-top: 8px; white-space: nowrap; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; padding: 0 12px; color: #222; }
  .arrow { width: 56px; display: flex; justify-content: center; align-items: center; flex: none; }
</style></head>
<body>
<div class="frame" id="fig">
  <div class="title">Lab 1 workflow</div>
  <div class="row">
    <div class="group">
      <div class="head"><div class="step">1</div><div class="title">Private repository</div></div>
      <div class="item">Collaborator</div>
    </div>
    <div class="arrow"><svg width="44" height="20"><line x1="2" y1="10" x2="32" y2="10" stroke="#107c10" stroke-width="2.5"/><polygon points="32,3 42,10 32,17" fill="#107c10"/></svg></div>
    <div class="group">
      <div class="head"><div class="step">2</div><div class="title">Clone</div></div>
      <div class="item">Local copy</div>
    </div>
    <div class="arrow"><svg width="44" height="20"><line x1="2" y1="10" x2="32" y2="10" stroke="#107c10" stroke-width="2.5"/><polygon points="32,3 42,10 32,17" fill="#107c10"/></svg></div>
    <div class="group">
      <div class="head"><div class="step">3</div><div class="title">Branch</div></div>
      <div class="item">lab-01</div>
    </div>
    <div class="arrow"><svg width="44" height="20"><line x1="2" y1="10" x2="32" y2="10" stroke="#107c10" stroke-width="2.5"/><polygon points="32,3 42,10 32,17" fill="#107c10"/></svg></div>
    <div class="group">
      <div class="head"><div class="step">4</div><div class="title">Commit</div></div>
      <div class="item">Five stages</div>
    </div>
    <div class="arrow"><svg width="44" height="20"><line x1="2" y1="10" x2="32" y2="10" stroke="#107c10" stroke-width="2.5"/><polygon points="32,3 42,10 32,17" fill="#107c10"/></svg></div>
    <div class="group">
      <div class="head"><div class="step">5</div><div class="title">Push</div></div>
      <div class="item">Branch on GitHub</div>
    </div>
    <div class="arrow"><svg width="44" height="20"><line x1="2" y1="10" x2="32" y2="10" stroke="#107c10" stroke-width="2.5"/><polygon points="32,3 42,10 32,17" fill="#107c10"/></svg></div>
    <div class="group">
      <div class="head"><div class="step">6</div><div class="title">Pull request</div></div>
      <div class="item">Review</div>
    </div>
    <div class="arrow"><svg width="44" height="20"><line x1="2" y1="10" x2="32" y2="10" stroke="#107c10" stroke-width="2.5"/><polygon points="32,3 42,10 32,17" fill="#107c10"/></svg></div>
    <div class="group">
      <div class="head"><div class="step">7</div><div class="title">Merge</div></div>
      <div class="item">Main</div>
    </div>
  </div>
</div>
</body></html>
