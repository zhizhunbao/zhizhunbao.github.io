<!doctype html>
<html><head><meta charset="utf-8">
<!-- Point: the 11 Markdown elements of Lab 1, each with the plain-text syntax that writes it. -->
<style>
  body { margin: 0; background: #fff; font-family: "Segoe UI", sans-serif; }
  .frame { display: inline-block; margin: 2px; padding: 14px; border: 1.5px dashed #333; border-radius: 10px; }
  .title { display: inline-block; border: 2px solid #e8a317; padding: 2px 6px; font-size: 22px; font-weight: 600; color: #222; margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: repeat(4, 250px); gap: 10px; }
  .item { border: 1.5px solid #0f6cbd; background: #f3f7fd; border-radius: 3px; padding: 8px 10px; color: #222; }
  .name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  code { font-family: Consolas, monospace; font-size: 14px; color: #0f6cbd; white-space: pre; }
</style></head>
<body>
<div class="frame" id="fig">
  <div class="title">Markdown elements in Lab 1</div>
  <div class="grid">
    <div class="item"><div class="name">Heading</div><code># Title</code></div>
    <div class="item"><div class="name">Text formatting</div><code>**bold**  *italic*</code></div>
    <div class="item"><div class="name">List</div><code>- item   1. item</code></div>
    <div class="item"><div class="name">Link</div><code>[text](url)</code></div>
    <div class="item"><div class="name">Image</div><code>![alt](image.png)</code></div>
    <div class="item"><div class="name">Blockquote</div><code>&gt; quote</code></div>
    <div class="item"><div class="name">Inline code</div><code>`git status`</code></div>
    <div class="item"><div class="name">Fenced code block</div><code>```bash</code></div>
    <div class="item"><div class="name">Table</div><code>| a | b |</code></div>
    <div class="item"><div class="name">Task list</div><code>- [x] done</code></div>
    <div class="item"><div class="name">Horizontal rule</div><code>---</code></div>
  </div>
</div>
</body></html>
