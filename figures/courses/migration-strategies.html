<!doctype html>
<html><head><meta charset="utf-8">
<!-- Point: the eight CAF cloud migration strategies, each with the words CAF gives it for what it does to the workload. -->
<style>
  body { margin: 0; background: #fff; font-family: "Segoe UI", sans-serif; }
  .frame { display: inline-block; margin: 2px; padding: 14px; border: 1.5px dashed #333; border-radius: 10px; }
  .title { display: inline-block; border: 2px solid #e8a317; padding: 2px 6px; font-size: 22px; font-weight: 600; color: #222; margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: repeat(4, 270px); gap: 10px; }
  .item { border: 1.5px solid #0f6cbd; background: #f3f7fd; border-radius: 3px; padding: 8px 10px; color: #222; text-align: center; }

  .what { font-size: 14px; color: #0f6cbd; white-space: nowrap; }

<body>
<div class="frame" id="fig">
  <div class="title">Migration approach (Cloud migration strategies)</div>
  <div class="grid">
    <div class="item"><div class="name">1 Retire</div><div class="what">Decommission</div></div>
    <div class="item"><div class="name">2 Rehost</div><div class="what">Like-for-like migration</div></div>
    <div class="item"><div class="name">3 Replatform</div><div class="what">Modernize hosting environment</div></div>
    <div class="item"><div class="name">4 Refactor</div><div class="what">Modernize code</div></div>
    <div class="item"><div class="name">5 Rearchitect</div><div class="what">Modernize architecture and code</div></div>
    <div class="item"><div class="name">6 Replace</div><div class="what">Use SaaS alternative</div></div>
    <div class="item"><div class="name">7 Rebuild</div><div class="what">Build cloud-native</div></div>
    <div class="item"><div class="name">8 Retain</div><div class="what">Keep as is</div></div>
  </div>
</div>
