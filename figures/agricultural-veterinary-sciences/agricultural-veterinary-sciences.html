<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; font-family: "Segoe UI", sans-serif; }
  .frame { display: inline-block; margin: 2px; padding: 14px 14px 14px; border: 1.5px dashed #333; border-radius: 10px; }
  .title { display: inline-block; border: 2px solid #e8a317; padding: 2px 6px; font-size: 22px; font-weight: 600; color: #222; margin-bottom: 18px; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1220px; align-items: stretch; }
  .group { flex: 1 1 auto; border: 1.5px dashed #0f6cbd; border-radius: 6px; padding: 12px; box-sizing: border-box; }
  .group .title { white-space: nowrap; color: #0f6cbd; font-size: 19px; margin-bottom: 12px; }
  .item { border: 1.5px solid #0f6cbd; background: #f3f7fd; border-radius: 3px; height: 34px; margin-bottom: 8px; white-space: nowrap; padding: 0 12px;
          display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #222; }
</style></head>

      <div class="item">Phenomena</div>
      <div class="item">Processes</div>
      <div class="item">Products</div>
      <div class="item">Properties</div>
      <div class="item">Resources</div>
      <div class="item">Site</div>
      <div class="item">Stages</div>
      <div class="item">State</div>
      <div class="item">Strategies</div>
      <div class="item">Subjects</div>
      <div class="item">Substances</div>
      <div class="item">Systems</div>
      <div class="item">Technology</div>
      <div class="item">Time</div>
    </div>
  </div>
</div>
</body></html>
