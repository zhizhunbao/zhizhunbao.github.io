<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; font-family: "Segoe UI", sans-serif; }
  .frame { display: inline-block; margin: 2px; padding: 14px; border: 1.5px dashed #333; border-radius: 10px; }
  .title { display: inline-block; border: 2px solid #e8a317; padding: 2px 6px; font-size: 22px; font-weight: 600; color: #222; margin-bottom: 18px; }
  .row { display: flex; gap: 20px; align-items: stretch; }
  .row + .row { margin-top: 20px; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .col .group { flex: 1 0 auto; }
  .group { min-width: 390px; border: 1.5px dashed #0f6cbd; border-radius: 6px; padding: 12px; box-sizing: border-box; }
  .group .title { white-space: nowrap; color: #0f6cbd; font-size: 19px; margin-bottom: 12px; }
  .item { border: 1.5px solid #0f6cbd; background: #f3f7fd; border-radius: 3px; height: 50px; margin-bottom: 10px;
          display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-align: center; padding: 0 6px; color: #222; }
  .group { width: max-content; }
  .lone { border: 2px solid #e8a317; width: 330px; margin-bottom: 20px; }
</style></head>
<body>
<div class="frame" id="fig">
  <div class="title">Development</div>
  <div class="row">
    <div class="col">
      <div class="group">
        <div class="title">Common language runtime (CLR)</div>
      </div>
    </div>
    <div class="col">
      <div class="group">
        <div class="title">Extended stored procedure</div>
      </div>
    </div>
    <div class="col">
      <div class="group">
        <div class="title">JSON</div>
      </div>
    </div>
    <div class="col">
      <div class="group">
        <div class="title">Fuzzy string matching</div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col">
      <div class="group">
        <div class="title">Regular expression</div>
      </div>
    </div>
    <div class="col">
      <div class="group">
        <div class="title">Language Extensions</div>
      </div>
    </div>
    <div class="col">
      <div class="group">
        <div class="title">SQL Server Native Client (SNAC)</div>
      </div>
    </div>
    <div class="col">
      <div class="group">
        <div class="title">SQL Server Native Client OLE DB provider (SQLNCLI)</div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col">
      <div class="group">
        <div class="title">ODBC</div>
      </div>
    </div>
    <div class="col">
      <div class="group">
        <div class="title">SQL Server Management Objects (SMO)</div>
      </div>
    </div>
    <div class="col">
      <div class="group">
        <div class="title">SQLXML</div>
      </div>
    </div>
    <div class="col">
      <div class="group">
        <div class="title">WMI provider</div>
      </div>
    </div>
  </div>
</div>
</body></html>
