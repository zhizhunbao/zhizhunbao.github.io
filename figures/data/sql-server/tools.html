<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; font-family: "Segoe UI", sans-serif; }
  .frame { display: inline-block; margin: 2px; padding: 14px; border: 1.5px dashed #333; border-radius: 10px; }
  .title { display: inline-block; border: 2px solid #e8a317; padding: 2px 6px; font-size: 22px; font-weight: 600; color: #222; margin-bottom: 18px; }
  .row { display: flex; gap: 20px; align-items: stretch; }
  .row + .row { margin-top: 20px; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .col .group { flex: 1 0 auto; }
  .group { min-width: 390px; border: 1.5px dashed #0f6cbd; border-radius: 6px; padding: 12px; box-sizing: border-box; }
  .group .title { white-space: nowrap; color: #0f6cbd; font-size: 19px; margin-bottom: 12px; }
  .item { border: 1.5px solid #0f6cbd; background: #f3f7fd; border-radius: 3px; height: 50px; margin-bottom: 10px;
          display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-align: center; padding: 0 6px; color: #222; }
  .group { width: max-content; }
  .lone { border: 2px solid #e8a317; width: 330px; margin-bottom: 20px; }
</style></head>
<body>
<div class="frame" id="fig">
  <div class="title">Tools</div>
  <div class="row">
    <div class="col">
      <div class="group">
        <div class="title">dta utility</div>
      </div>
    </div>
    <div class="col">
      <div class="group">
        <div class="title">Distributed Replay</div>
      </div>
    </div>
    <div class="col">
      <div class="group">
        <div class="title">SQL Server Configuration Manager</div>
      </div>
    </div>
    <div class="col">
      <div class="group">
        <div class="title">bulk copy program utility (bcp)</div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col">
      <div class="group">
        <div class="title">sqlcmd utility</div>
      </div>
    </div>
    <div class="col">
      <div class="group">
        <div class="title">ssbdiagnose utility</div>
      </div>
    </div>
    <div class="col">
      <div class="group">
        <div class="title">SQL Server Data Tools (SSDT)</div>
      </div>
    </div>
    <div class="col">
      <div class="group">
        <div class="title">SQL Server Management Studio (SSMS)</div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col">
      <div class="group">
        <div class="title">SQL database project</div>
      </div>
    </div>
    <div class="col">
      <div class="group">
        <div class="title">SqlPackage</div>
      </div>
    </div>
    <div class="col">
      <div class="group">
        <div class="title">SQL Server Profiler</div>
      </div>
    </div>
    <div class="col">
      <div class="group">
        <div class="title">MSSQL extension for Visual Studio Code</div>
      </div>
    </div>
  </div>
</div>
</body></html>
