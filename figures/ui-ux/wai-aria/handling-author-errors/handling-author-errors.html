<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; font-family: "Segoe UI", sans-serif; }
  .frame { display: inline-block; margin: 2px; padding: 14px; border: 1.5px dashed #333; border-radius: 10px; }
  .title { display: inline-block; border: 2px solid #e8a317; padding: 2px 6px; font-size: 22px; font-weight: 600; color: #222; margin-bottom: 18px; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; width: 1220px; align-items: stretch; }
  .row .group { flex: 1 1 auto; }
  .group { border: 1.5px dashed #0f6cbd; border-radius: 6px; padding: 12px; box-sizing: border-box; }
  .group .title { white-space: nowrap; color: #0f6cbd; font-size: 19px; margin-bottom: 12px; }
  .item { border: 1.5px solid #0f6cbd; background: #f3f7fd; border-radius: 3px; height: 34px; margin-bottom: 8px; white-space: nowrap; padding: 0 12px;
          display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #222; }
  .stack { display: flex; flex-direction: column; }
  .stack .item { margin-bottom: 8px; }
  .flow { display: flex; flex-wrap: wrap; gap: 8px; }
  .flow .item { margin-bottom: 0; }
  .group.wide { flex: 1 1 100%; }
</style>
</head>
<body>
<div class="frame" id="fig">
  <div class="title">9. Handling Author Errors</div>
  <div class="row">
    <div class="group">
      <div class="title">9.1 Roles</div>
    </div>
    <div class="group">
      <div class="title">9.2 States and Properties</div>
    </div>
  </div>
</div>
<script>
  // groups share the page width in equal columns: as many columns as the fullest row holds; a group that wraps keeps the
  // column width; a group whose content is wider than a column keeps its own width; a full-width (wide) group stays out
  const row = document.querySelector(\'.row\'), gs = [...row.querySelectorAll(\':scope > .group:not(.wide)\')];
  if (gs.length > 1) {
    gs.forEach(g => { g.style.flex = \'0 0 auto\'; });
    const natural = gs.map(g => g.offsetWidth);
    gs.forEach(g => { g.style.flex = \'\'; });
    const rows = {};
    gs.forEach(g => { rows[g.offsetTop] = (rows[g.offsetTop] || 0) + 1; });
    const n = Math.max(...Object.values(rows));
    const w = (row.clientWidth - 20 * (n - 1)) / n;
    gs.forEach((g, i) => { const x = Math.max(w, natural[i]); g.style.flex = \'0 0 \' + x + \'px\'; g.style.width = x + \'px\'; });
  }
</script>
</body></html>
