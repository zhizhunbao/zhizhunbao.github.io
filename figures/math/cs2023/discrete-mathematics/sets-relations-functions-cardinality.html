<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; font-family: "Segoe UI", sans-serif; }
  .frame { display: inline-block; margin: 2px; padding: 14px; border: 1.5px dashed #333; border-radius: 10px; position: relative; }
  .title { display: inline-block; border: 2px solid #e8a317; padding: 2px 6px; font-size: 22px; font-weight: 600; color: #222; margin-bottom: 18px; }
  .row { display: flex; gap: 70px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .terms { padding: 0 12px; min-width: 300px; }
  .group { border: 1.5px dashed #0f6cbd; border-radius: 6px; padding: 12px; box-sizing: border-box; }
  .group .title { white-space: nowrap; color: #0f6cbd; font-size: 19px; margin-bottom: 12px; }
  .item { border: 2px solid #e8a317; background: #f3f7fd; border-radius: 3px; height: 34px; margin-bottom: 8px; white-space: nowrap;
          display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; text-align: center; padding: 0 14px; color: #222; }
  .terms .item { margin-bottom: 0; }
</style></head>
<body>
<div class="frame" id="fig">
  <div class="title">Sets, relations, functions, cardinality</div>
  <div class="row">
    <div class="col terms">
      <div class="item" data-from="0">Set</div>
      <div class="item">Relation</div>
      <div class="item">Function</div>
      <div class="item" data-from="3">Cardinality</div>
    </div>
    <div class="col side">
      <div class="group">
        <div class="title" id="to-0">Set</div>
        <div class="item">Finite set</div>
        <div class="item">Countable set</div>
        <div class="item">Uncountable set</div>
      </div>
      <div class="group">
        <div class="title" id="to-3">Cardinality</div>
        <div class="item">Sum rule</div>
        <div class="item">Product rule</div>
        <div class="item">Inclusion-exclusion principle</div>
      </div>
    </div>
  </div>
  <svg id="link" style="position:absolute;left:0;top:0;overflow:visible;pointer-events:none;"></svg>
</div>
<script>
  // side groups as wide as the widest; one dashed curve from each box to its group's title
  const gs = [...document.querySelectorAll('.side .group')];
  const w = Math.max(...gs.map(g => g.getBoundingClientRect().width));
  gs.forEach(g => g.style.width = w + 'px');
  const fig = document.getElementById('fig').getBoundingClientRect();
  let paths = '';
  document.querySelectorAll('[data-from]').forEach(a => {
    const r = a.getBoundingClientRect(), b = document.getElementById('to-' + a.dataset.from).getBoundingClientRect();
    const x1 = r.right - fig.left, y1 = r.top + r.height / 2 - fig.top, x2 = b.left - fig.left, y2 = b.top + b.height / 2 - fig.top, mx = (x1 + x2) / 2;
    paths += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="#0f6cbd" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  });
  document.getElementById('link').innerHTML = paths;
</script>
</body></html>
