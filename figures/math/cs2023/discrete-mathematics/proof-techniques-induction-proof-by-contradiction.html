<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; font-family: "Segoe UI", sans-serif; }
  .frame { display: inline-block; margin: 2px; padding: 14px; border: 1.5px dashed #333; border-radius: 10px; }
  .title { display: inline-block; border: 2px solid #e8a317; padding: 2px 6px; font-size: 22px; font-weight: 600; color: #222; margin-bottom: 18px; }
  .col { display: flex; flex-direction: column; min-width: 360px; padding: 0 12px; }
  .item { border: 2px solid #e8a317; background: #f3f7fd; border-radius: 3px; height: 34px; margin-bottom: 8px; white-space: nowrap;
          display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; text-align: center; padding: 0 14px; color: #222; }
</style></head>
<body>
<div class="frame" id="fig">
  <div class="title">Proof techniques (induction, proof by contradiction)</div>
  <div class="col">
    <div class="item">Induction</div>
    <div class="item">Proof by contradiction</div>
  </div>
</div>
</body></html>
