<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; font-family: "Segoe UI", sans-serif; }
  .frame { display: inline-block; margin: 2px; padding: 14px 14px 14px; border: 1.5px dashed #333; border-radius: 10px; }
  .title { display: inline-block; border: 2px solid #e8a317; padding: 2px 6px; font-size: 22px; font-weight: 600; color: #222; margin-bottom: 18px; }
  .row { display: flex; flex-wrap: wrap; max-width: 1220px; gap: 14px; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .col .group { flex: 1 0 auto; }
  .group { min-width: 440px; white-space: nowrap; border: 1.5px dashed #0f6cbd; border-radius: 6px; padding: 12px; box-sizing: border-box; }
  .group .title { white-space: nowrap; color: #0f6cbd; font-size: 19px; margin-bottom: 12px; }
  .item { border: 1.5px solid #0f6cbd; background: #f3f7fd; border-radius: 3px; height: 34px; margin-bottom: 8px;
          display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #222; padding: 0 14px; white-space: nowrap; }
 .group { min-width: 0; } .sym { font-family: "Cambria Math", "Segoe UI Symbol", serif; font-size: 17px; font-weight: 400; color: #0f6cbd; } .desc { font-weight: 600; } .group { width: 1180px; white-space: normal; } .items { display: flex; flex-wrap: wrap; gap: 8px; } .items .item { min-width: 130px; margin-bottom: 0; }</style></head>
<body>
<div class="frame" id="fig">
  <div class="title">IUPAC Green Book</div>
  <div class="row">
    <div class="col">
      <div class="group">
        <div class="title">5 Vectors</div>
        <div class="items">
        <div class="item"><span class="sym"><b><i>a</i></b>, <i>a⃗</i></span></div>
        <div class="item"><span class="sym"><i>a<sub>x</sub></i>, <i>a<sub>y</sub></i>, <i>a<sub>z</sub></i></span></div>
        <div class="item"><span class="sym"><b><i>e</i></b><sub><i>x</i></sub>, <b><i>e</i></b><sub><i>y</i></sub>, <b><i>e</i></b><sub><i>z</i></sub> or <b><i>i</i></b>, <b><i>j</i></b>, <b><i>k</i></b></span></div>
        <div class="item"><span class="sym"><b><i>a</i></b> ⋅ <b><i>b</i></b></span></div>
        <div class="item"><span class="sym"><b><i>a</i></b> × <b><i>b</i></b>, (<b><i>a</i></b> ∧ <b><i>b</i></b>)</span></div>
        <div class="item"><span class="sym">∇ = <b><i>e</i></b><sub><i>x</i></sub>∂/∂<i>x</i> + <b><i>e</i></b><sub><i>y</i></sub>∂/∂<i>y</i> + <b><i>e</i></b><sub><i>z</i></sub>∂/∂<i>z</i></span></div>
        <div class="item"><span class="sym">∇<sup>2</sup>, △ = ∂<sup>2</sup>/∂<i>x</i><sup>2</sup> + ∂<sup>2</sup>/∂<i>y</i><sup>2</sup> + ∂<sup>2</sup>/∂<i>z</i><sup>2</sup></span></div>
        <div class="item"><span class="sym">grad <i>V</i>, ∇<i>V</i></span></div>
        <div class="item"><span class="sym">div <b><i>A</i></b>, ∇ ⋅ <b><i>A</i></b></span></div>
        <div class="item"><span class="sym">rot <b><i>A</i></b>, ∇ × <b><i>A</i></b>, (curl <b><i>A</i></b>)</span></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
