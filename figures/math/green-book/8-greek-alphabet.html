<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; font-family: "Segoe UI", sans-serif; }
  .frame { display: inline-block; margin: 2px; padding: 14px 14px 14px; border: 1.5px dashed #333; border-radius: 10px; }
  .title { display: inline-block; border: 2px solid #e8a317; padding: 2px 6px; font-size: 22px; font-weight: 600; color: #222; margin-bottom: 18px; }
  .row { display: flex; flex-wrap: wrap; max-width: 1220px; gap: 14px; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .col .group { flex: 1 0 auto; }
  .group { min-width: 440px; white-space: nowrap; border: 1.5px dashed #0f6cbd; border-radius: 6px; padding: 12px; box-sizing: border-box; }
  .group .title { white-space: nowrap; color: #0f6cbd; font-size: 19px; margin-bottom: 12px; }
  .item { border: 1.5px solid #0f6cbd; background: #f3f7fd; border-radius: 3px; height: 34px; margin-bottom: 8px;
          display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #222; padding: 0 14px; white-space: nowrap; }
 .group { min-width: 0; } .sym { font-family: "Cambria Math", "Segoe UI Symbol", serif; font-size: 17px; font-weight: 400; color: #0f6cbd; } .desc { font-weight: 600; } .group { width: 1180px; white-space: normal; } .items { display: flex; flex-wrap: wrap; gap: 8px; } .items .item { min-width: 130px; margin-bottom: 0; }</style></head>
<body>
<div class="frame" id="fig">
  <div class="title">Mathematical Symbols</div>
  <div class="row">
    <div class="col">
      <div class="group">
        <div class="title">8 Greek Alphabet</div>
        <div class="items">
        <div class="item"><span class="sym">Α α</span></div>
        <div class="item"><span class="sym">Β β</span></div>
        <div class="item"><span class="sym">Γ γ</span></div>
        <div class="item"><span class="sym">Δ δ</span></div>
        <div class="item"><span class="sym">Ε ε ϵ</span></div>
        <div class="item"><span class="sym">Ζ ζ</span></div>
        <div class="item"><span class="sym">Η η</span></div>
        <div class="item"><span class="sym">Θ θ ϑ</span></div>
        <div class="item"><span class="sym">Ι ι</span></div>
        <div class="item"><span class="sym">Κ κ ϰ</span></div>
        <div class="item"><span class="sym">Λ λ</span></div>
        <div class="item"><span class="sym">Μ μ</span></div>
        <div class="item"><span class="sym">Ν ν</span></div>
        <div class="item"><span class="sym">Ξ ξ</span></div>
        <div class="item"><span class="sym">Ο ο</span></div>
        <div class="item"><span class="sym">Π π</span></div>
        <div class="item"><span class="sym">Ρ ρ</span></div>
        <div class="item"><span class="sym">Σ σ ς</span></div>
        <div class="item"><span class="sym">Τ τ</span></div>
        <div class="item"><span class="sym">Υ υ</span></div>
        <div class="item"><span class="sym">Φ φ ϕ</span></div>
        <div class="item"><span class="sym">Χ χ</span></div>
        <div class="item"><span class="sym">Ψ ψ</span></div>
        <div class="item"><span class="sym">Ω ω</span></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
