<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; font-family: "Segoe UI", sans-serif; }
  .frame { display: inline-block; margin: 2px; padding: 14px 14px 14px; border: 1.5px dashed #333; border-radius: 10px; }
  .title { display: inline-block; border: 2px solid #e8a317; padding: 2px 6px; font-size: 22px; font-weight: 600; color: #222; margin-bottom: 18px; }
  .row { display: flex; flex-wrap: wrap; max-width: 1220px; gap: 14px; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .col .group { flex: 1 0 auto; }
  .group { min-width: 440px; white-space: nowrap; border: 1.5px dashed #0f6cbd; border-radius: 6px; padding: 12px; box-sizing: border-box; }
  .group .title { white-space: nowrap; color: #0f6cbd; font-size: 19px; margin-bottom: 12px; }
  .item { border: 1.5px solid #0f6cbd; background: #f3f7fd; border-radius: 3px; height: 34px; margin-bottom: 8px;
          display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #222; padding: 0 14px; white-space: nowrap; }
 .group { min-width: 0; } .sym { font-family: "Cambria Math", "Segoe UI Symbol", serif; font-size: 17px; font-weight: 400; color: #0f6cbd; } .desc { font-weight: 600; } .items { display: flex; flex-wrap: wrap; gap: 8px; } .items .item { min-width: 130px; margin-bottom: 0; } .page > .row { max-width: 1180px; } .col .item { margin-bottom: 8px; }</style></head>
<style>.grid { display: flex; flex-wrap: wrap; gap: 8px; max-width: 1180px; } .grid .item { min-width: 130px; margin-bottom: 0; }</style>
<body>
<div class="frame" id="fig">
  <div class="title">0 Common Symbols</div>
  <div class="row">
    <div class="group">
      <div class="title">0.5 Greek Letters</div>
      <div class="grid">
          <div class="item"><span class="sym">α</span></div>
          <div class="item"><span class="sym">γ</span></div>
          <div class="item"><span class="sym">Γ(<i>n</i>)</span></div>
          <div class="item"><span class="sym">ε, δ</span></div>
          <div class="item"><span class="sym">ζ(<i>s</i>)</span></div>
          <div class="item"><span class="sym">η(<i>s</i>)</span></div>
          <div class="item"><span class="sym">θ</span></div>
          <div class="item"><span class="sym">λ</span></div>
          <div class="item"><span class="sym">μ, σ²</span></div>
          <div class="item"><span class="sym">π(<i>x</i>)</span></div>
          <div class="item"><span class="sym">σ</span></div>
          <div class="item"><span class="sym">φ</span></div>
          <div class="item"><span class="sym">φ(<i>n</i>)</span></div>
          <div class="item"><span class="sym">Φ(<i>z</i>)</span></div>
          <div class="item"><span class="sym">χ²</span></div>
          <div class="item"><span class="sym">ω(<i>n</i>)</span></div>
      </div>
    </div>
  </div>
</div>
</body></html>
