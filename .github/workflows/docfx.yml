name: Build and publish with DocFX

on:
  push:
    branches: [main]
  workflow_dispatch:

# 2026-11-06: publish by pushing the built site to the gh-pages branch (Settings > Pages > Deploy from a branch).
# actions/deploy-pages waits for Pages to sync the files and gives up after 10 minutes (its maximum); with
# about 16,500 files it timed out on four of six runs, so the workflow no longer waits on the sync.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history: git_times.py reads each page's last commit time
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.x
      - run: dotnet tool update -g docfx
      - run: python3 docs/templates/kb/git_times.py
      - run: docfx docs/docfx.build.json
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/_site
          force_orphan: true  # one commit on gh-pages: the built site's history is not kept
