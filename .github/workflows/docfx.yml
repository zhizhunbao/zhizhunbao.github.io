name: Build and publish with DocFX

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history: git_times.py reads each page's last commit time
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.x
      - run: dotnet tool update -g docfx
      - run: python3 docs/templates/kb/git_times.py
      - run: docfx docs/docfx.build.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # 2026-11-06: syncing the ~275 MB site took longer than the default 10 minutes twice; 30 minutes.
          timeout: 1800000
